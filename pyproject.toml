[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reporepair"
version = "0.1.0"
description = "AI GitHub Issue to Pull Request Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.3",
    "langgraph>=0.2.20",
    "langchain>=0.2.16",
    "langchain-google-genai>=1.0.10",
    "PyGithub>=2.3.0",
    "GitPython>=3.1.43",
    "chromadb>=0.5.3",
    "sentence-transformers>=3.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "rich>=13.7.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.10",
    "black>=24.4.2",
    "mypy>=1.10.0",
]

[project.scripts]
reporepair = "cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
